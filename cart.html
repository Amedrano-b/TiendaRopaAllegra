<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrito de Compras - Allegra</title>
    
    <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,400,0,0"
    />
    
    <!-- CSS -->
    <link rel="stylesheet" href="asset/css/stylesCart.css" />
    <link rel="stylesheet" href="asset/css/styles.css" />
    <link rel="stylesheet" href="asset/css/swiper.css" />
  </head>
  <body>
    <!-- ============= Header ============= -->
    <header class="header">
      <nav class="header__container container">
        <div class="header__logo">
          <h1><a href="./">Allegra</a></h1>
        </div>
        <ul class="header__links">
          <li class="header__link">
            <a href="#home" class="active">home</a>
          </li>
          <li class="header__link">
            <a href="#new">new</a>
          </li>
          <li class="header__link">
            <a href="#shop">shop</a>
          </li>
          <li class="header__link">
            <a href="#trending">trending</a>
          </li>
        </ul>
        <div class="container-icon">
          <a href="cart.html">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="icon-cart"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm7.5 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z"
              />
            </svg>
          </a>
          <a href="login.html">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="icon-user"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"
              />
            </svg>
          </a>
        </div>

        <div class="header__btn">
          <span style="--i: 0"></span>
          <span style="--i: 10"></span>
          <span style="--i: 20"></span>
        </div>
      </nav>
    </header>

    <main>
      <section class="cart-container">
        <h2>Carrito de Compras</h2>

        <div class="cart-items">
          <!-- Los productos del carrito se cargarán dinámicamente desde la API -->
        </div>

        <div class="cart-summary">
          <div class="summary-row">
            <span>Subtotal:</span>
            $<span id="subtotal">0.00</span>
          </div>
          <div class="summary-row">
            <span>Envío:</span>
            $<span id="shipping">5.00</span>
          </div>
          <div class="summary-row total">
            <span>Total:</span>
            $<span id="total">0.00</span>
          </div>
          <button class="checkout-button">Proceder al Pago</button>
        </div>
      </section>
    </main>
    <footer>
      <div class="container">
        <p>&copy; Allegra 2025</p>
      </div>
    </footer>

    <script src="asset/js/scriptCart.js"></script>
  </body>
</html>
