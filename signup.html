<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Allegra</title>
    <link rel="stylesheet" href="asset/styles.css" />
</head>

<body>
    <section class="left-form">
        
    </section>
    <section class="right-form">
        <div class="signup-container">
            <h1 class="logo"> Allegra</h1>
            <h2 class="signup-title">Sign Up</h2>
            <form id="signup-form" action="" method="post">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Ex: Allegra Medrano" required />

                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Ex: Allegra@gmail.com" required />

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="***********" required />

                <label for="repeat-password">Repeat Password</label>
                <input type="password" id="repeat-password" placeholder="***********" required />

                <div class="signup-options">
                    <label><input type="checkbox" />I agree to Terms of User</label>
                </div>
                <div class="button-group">
                    <form action=""><button>Sign Up</button></form>
                </div>
                <div class="button-group">
                    <form action="index.html"><button>Go Back</button></form>
                </div>
            </form>
        </div>
    </section>

</body>

</html>
