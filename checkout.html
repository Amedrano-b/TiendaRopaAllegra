<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google Fonts Icons -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,400,0,0"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="asset/css/styles.css" />
    <link rel="stylesheet" href="asset/css/stylesCheckout.css" />

    <title>Allegra - Checkout</title>
  </head>
  <body>
    <!-- ============= Header ============= -->
    <header class="header">
      <nav class="header__container container">
        <div class="header__logo">
          <h1><a href="./">Allegra</a></h1>
        </div>
        <ul class="header__links">
          <li class="header__link">
            <a href="#home" class="active">home</a>
          </li>
          <li class="header__link">
            <a href="#new">new</a>
          </li>
          <li class="header__link">
            <a href="#shop">shop</a>
          </li>
          <li class="header__link">
            <a href="#trending">trending</a>
          </li>
        </ul>
        <div class="container-icon">
          <a href="cart.html">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="icon-cart"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm7.5 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z"
              />
            </svg>
          </a>
          <a href="login.html">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="icon-user"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"
              />
            </svg>
          </a>
        </div>
      </nav>
    </header>
    <!-- ============= Checkout ============= -->
    <div class="checkout-container">
      <!-- Left Column: Checkout Form -->
      <div class="checkout-form">
        <!-- Shipping Address -->
        <div class="form-section">
          <h2 class="section-title">
            <i class="fas fa-truck"></i> Información de Envío
          </h2>
          <div class="form-group">
            <label for="fullName">Nombre Completo</label>
            <input
              type="text"
              id="fullName"
              class="form-control"
              placeholder="Nombre"
            />
          </div>
          <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input
              type="email"
              id="email"
              class="form-control"
              placeholder="nombre@ejemplo.com"
            />
          </div>
          <div class="form-group">
            <label for="address">Dirección</label>
            <input
              type="text"
              id="address"
              class="form-control"
              placeholder="Calle Principal"
            />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="city">Ciudad</label>
              <input
                type="text"
                id="city"
                class="form-control"
                placeholder="Ciudad"
              />
            </div>
            <div class="form-group">
              <label for="zip">Código Postal</label>
              <input
                type="text"
                id="zip"
                class="form-control"
                placeholder="12345"
              />
            </div>
          </div>
          <div class="form-group">
            <label for="country">País</label>
            <input
              type="text"
              id="country"
              class="form-control"
              placeholder="País"
            />
          </div>
        </div>

        <!-- Payment Method -->
        <div class="form-section">
          <h2 class="section-title">
            <i class="fas fa-credit-card"></i> Método de Pago
          </h2>
          <div class="payment-methods">
            <div class="payment-method active" id="creditCard">
              <i class="fas fa-credit-card"></i>
              <div>Tarjeta de Crédito</div>
            </div>
            <div class="payment-method" id="paypal">
              <i class="fab fa-paypal"></i>
              <div>PayPal</div>
            </div>
            <div class="payment-method" id="cash">
              <i class="fas fa-money-bill-wave"></i>
              <div>Efectivo</div>
            </div>
          </div>

          <div class="form-group">
            <label for="cardNumber">Número de Tarjeta</label>
            <input
              type="text"
              id="cardNumber"
              class="form-control"
              placeholder="1234 5678 9012 3456"
            />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="expiry">Fecha de Expiración</label>
              <input
                type="text"
                id="expiry"
                class="form-control"
                placeholder="MM/AA"
              />
            </div>
            <div class="form-group">
              <label for="cvv">CVV</label>
              <input
                type="text"
                id="cvv"
                class="form-control"
                placeholder="123"
              />
            </div>
          </div>
          <div class="checkbox-group">
            <input type="checkbox" id="saveCard" />
            <label for="saveCard"
              >Guardar información de tarjeta para futuras compras</label
            >
          </div>
        </div>

        <!-- Billing Address -->
        <div class="form-section">
          <h2 class="section-title">
            <i class="fas fa-file-invoice-dollar"></i> Dirección de Facturación
          </h2>
          <div class="checkbox-group">
            <input type="checkbox" id="sameAsShipping" checked />
            <label for="sameAsShipping">Igual que la dirección de envío</label>
          </div>
          <div id="billingAddress" style="display: none">
            <div class="form-group">
              <label for="billingName">Nombre Completo</label>
              <input type="text" id="billingName" class="form-control" />
            </div>
            <div class="form-group">
              <label for="billingAddress">Dirección</label>
              <input type="text" id="billingAddress" class="form-control" />
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="billingCity">Ciudad</label>
                <input type="text" id="billingCity" class="form-control" />
              </div>
              <div class="form-group">
                <label for="billingZip">Código Postal</label>
                <input type="text" id="billingZip" class="form-control" />
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Right Column: Order Summary -->
      <div class="order-summary">
        <h2 class="section-title">
          <i class="fas fa-receipt"></i> Resumen de Pedido
        </h2>

        <div class="order-items">
          <div class="order-item">
            <div class="item-name"></div>
            <div class="item-price"></div>
          </div>
          <div class="order-item">
            <div class="item-name"></div>
            <div class="item-price"></div>
          </div>
          <div class="order-item">
            <div class="item-name"></div>
            <div class="item-price"></div>
          </div>
          <div class="order-item">
            <div class="item-name"></div>
            <div class="item-price"></div>
          </div>
        </div>

        <div class="order-total">
          <div class="total-row">
            <div></div>
            <div></div>
          </div>
          <div class="total-row">
            <div></div>
            <div></div>
          </div>
          <div class="total-row">
            <div></div>
            <div></div>
          </div>
          <div class="total-row final">
            <div></div>
            <div></div>
          </div>
        </div>

        <button class="btn" id="placeOrder">
          <span class="btn-text">Realizar Pedido</span>
          <span class="btn-spinner" style="display: none">
            <i class="fas fa-spinner fa-spin"></i>
          </span>
        </button>
      </div>
    </div>

    <!-- ============= Footer ============= -->

    <footer class="footer">
      <div class="footer__copyRight">
        <p>&copy; 2025 <span>Allegra</span> All Rights Reserved</p>
      </div>
    </footer>
  </body>
  <script src="asset/js/scriptChekout.js"></script>
</html>
