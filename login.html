<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Allegra</title>
    <link rel="stylesheet" href="asset/styles.css" />
</head>

<body>
    <section id="login">
        <div class="login-container">
            <h1 class="logo"> Allegra</h1>
            <h2 class="login-title">Log In</h2>
            <form id="loginForm">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Ex: Allegra@gmail.com" required />

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="***********" required />

                <div class="login-options">
                    <label><input type="checkbox" /> Remember me</label>
                    <a href="#">Forgot password?</a>
                </div>

                <div class="button-group">
                    <form action=""><button>Log in</button></form>
                </div>
            </form>
            <p>If you don’t have an account ...</p>
            <form action="signup.html"><button>Create an account</button></form>
        </div>
    </section>
    <script src="asset/index.js"></script>
</body>

</html>
